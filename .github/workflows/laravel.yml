name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, zip, bcmath
          coverage: none

      - name: Copier .env
        run: cp .env.example .env

      - name: Installer les dépendances Composer
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Générer la clé Laravel
        run: php artisan key:generate

      - name: Donner les permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Créer la base MySQL
        run: |
          mkdir -p database
          touch database/database.mysql

      - name: Lancer les tests
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: database/database.mysql
        run: php artisan test